<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Session · Claude Code</title>
  <meta name="description" content="A precision instrument for your Claude Code session — re-inits, compaction, context." />
  <meta name="theme-color" content="#0a0b0e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
  /* ════════════════════════════════════════════════════════════════════════
     SESSION — a precision instrument.  Warm ivory on deep ink, a single brass
     accent, Instrument Serif display.  No neon, no gradients-as-decoration.
     Everything inlined: one file, nothing can half-load.
     ════════════════════════════════════════════════════════════════════════ */
  :root{
    --ink:#0a0b0e;          /* deep, faintly warm black */
    --ink-2:#101218;        /* lifted surface */
    --hair:rgba(244,238,228,.10);
    --hair-2:rgba(244,238,228,.05);
    --ivory:#f4eee2;        /* warm off-white text */
    --muted:#9a948a;        /* warm grey */
    --faint:#5d584f;
    --brass:#e3b066;        /* the one accent — warm, not neon */
    --brass-soft:#caa168;
    --clay:#d08a5e;         /* shown only as context fills toward compaction */
    --sage:#a9c3a0;         /* calm "all clear" */
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Space Grotesk",system-ui,sans-serif;
    background:var(--ink);color:var(--ivory);line-height:1.5;min-height:100dvh;
    -webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;
  }
  /* warm vignette + the faintest grain of structure — depth, not decoration */
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(227,176,102,.10), transparent 55%),
      radial-gradient(100% 100% at 50% 120%, rgba(0,0,0,.5), transparent 60%);}
  .serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
  .tnum{font-variant-numeric:tabular-nums}

  .wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;
    padding:clamp(22px,5vw,46px) clamp(20px,5vw,40px) 56px;
    padding-top:max(env(safe-area-inset-top),clamp(22px,5vw,46px));
    opacity:0;transition:opacity .6s var(--ease)}
  .wrap.is-ready{opacity:1}

  /* ── masthead ─────────────────────────────────────────────────────────── */
  .mast{display:flex;justify-content:space-between;align-items:center;
    margin-bottom:clamp(28px,6vw,52px)}
  .word{display:flex;align-items:baseline;gap:10px;min-width:0}
  .word b{font-weight:500;font-size:15px;letter-spacing:.34em;text-transform:uppercase;white-space:nowrap}
  .word i{font-style:normal;font-size:12px;letter-spacing:.28em;color:var(--faint);text-transform:uppercase;white-space:nowrap}
  .sync{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
  .sync__dot{width:6px;height:6px;border-radius:50%;background:var(--faint);transition:.3s}
  .sync__dot.is-live{background:var(--sage);box-shadow:0 0 10px rgba(169,195,160,.6)}
  .reload{appearance:none;border:1px solid var(--hair);background:transparent;color:var(--muted);
    width:30px;height:30px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    transition:color .2s,border-color .2s,transform .5s var(--ease)}
  .reload svg{width:14px;height:14px}
  .reload:active{transform:rotate(-180deg)}
  .reload:hover{color:var(--ivory);border-color:var(--brass)}

  /* ── the instrument ───────────────────────────────────────────────────── */
  .stage{display:flex;flex-direction:column;align-items:center;text-align:center}
  .dial{position:relative;width:min(360px,84vw);aspect-ratio:1}
  .dial svg{width:100%;height:100%;overflow:visible}
  .ring-track{fill:none;stroke:var(--hair);stroke-width:2}
  .ring-fill{fill:none;stroke:var(--brass);stroke-width:3;stroke-linecap:round;
    transition:stroke-dashoffset 1.3s var(--ease),stroke .6s var(--ease)}
  .tick{stroke:var(--hair);stroke-width:1.5}
  .tick--major{stroke:rgba(244,238,228,.22)}
  .marker{fill:var(--brass);transition:transform 1.3s var(--ease),fill .6s var(--ease)}
  .spin-slow{transform-origin:160px 160px;animation:spin 90s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .dial__core{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;padding:14% 16%}
  .state{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--state,var(--sage))}
  .state__dot{width:7px;height:7px;border-radius:50%;background:var(--state,var(--sage));
    animation:pulse 2.6s var(--ease) infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .since{display:flex;align-items:baseline;justify-content:center;gap:.12em;
    line-height:.9;color:var(--ivory)}
  .since__v{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(72px,22vw,120px);
    letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .since__u{font-family:"Instrument Serif",Georgia,serif;font-style:italic;
    font-size:clamp(22px,7vw,36px);color:var(--muted)}
  .since__lbl{margin-top:12px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
  .since__when{margin-top:6px;font-size:13px;color:var(--muted)}
  .demo{margin-top:14px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--clay);
    border:1px solid rgba(208,138,94,.4);padding:3px 10px;border-radius:100px}

  /* context readout under the dial */
  .ctx{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:5px}
  .ctx__pct{font-family:"Instrument Serif",Georgia,serif;font-size:30px;color:var(--brass-soft)}
  .ctx__pct span{font-size:.5em;color:var(--muted)}
  .ctx__lbl{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
  .ctx__note{font-size:13px;color:var(--muted)}

  /* ── readouts strip ───────────────────────────────────────────────────── */
  .panel{margin-top:clamp(36px,7vw,56px);border-top:1px solid var(--hair);
    border-bottom:1px solid var(--hair);display:grid;grid-template-columns:repeat(2,1fr)}
  .read{padding:18px clamp(14px,3vw,22px);border-right:1px solid var(--hair-2);
    border-bottom:1px solid var(--hair-2)}
  .read:nth-child(2n){border-right:0}
  .read__k{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
  .read__v{font-family:"Instrument Serif",Georgia,serif;font-size:26px;color:var(--ivory);line-height:1}
  .read__v.sm{font-size:18px;letter-spacing:.02em}

  /* ── lifecycle timeline ───────────────────────────────────────────────── */
  .ledger{margin-top:clamp(34px,7vw,52px)}
  .ledger__h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
  .ledger__h h2{font-family:"Instrument Serif",Georgia,serif;font-size:26px;font-weight:400}
  .ledger__h span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .time{list-style:none;position:relative;padding-left:22px}
  .time::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--hair)}
  .time li{position:relative;padding:11px 0;display:flex;justify-content:space-between;gap:16px;
    border-bottom:1px solid var(--hair-2)}
  .time li:last-child{border-bottom:0}
  .time li::before{content:"";position:absolute;left:-22px;top:18px;width:9px;height:9px;border-radius:50%;
    background:var(--ink);border:1.5px solid var(--dotc,var(--brass));transform:translateX(0)}
  .time__label{font-size:14.5px}
  .time__time{font-size:12.5px;color:var(--muted);white-space:nowrap;letter-spacing:.02em}
  .time__empty{color:var(--faint);font-size:13.5px;padding:4px 0}

  .foot{margin-top:40px;text-align:center;font-size:12px;color:var(--faint);letter-spacing:.02em}
  .foot code{font-family:"Space Grotesk",monospace;color:var(--brass-soft);font-size:.92em}

  /* entrance */
  .rise{opacity:0;transform:translateY(16px)}
  .wrap.is-ready .rise{animation:rise .7s var(--ease) forwards;animation-delay:var(--d,0s)}
  @keyframes rise{to{opacity:1;transform:none}}

  @media (max-width:520px){
    .read__v{font-size:22px}.read__v.sm{font-size:16px}
  }
  @media (max-width:430px){
    .word i{display:none}.word b{letter-spacing:.24em}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
    .rise{opacity:1;transform:none}.wrap{opacity:1}
  }
  </style>
</head>
<body>
  <main class="wrap" id="app">
    <header class="mast rise">
      <div class="word">
        <b>Session</b><i>Claude Code</i>
      </div>
      <div class="sync">
        <span class="sync__dot" id="syncDot"></span>
        <span id="syncText">syncing</span>
        <button class="reload" id="refresh" aria-label="Sync now">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </header>

    <section class="stage rise" style="--d:.06s">
      <div class="dial">
        <svg viewBox="0 0 320 320" aria-hidden="true">
          <g id="ticks" class="spin-slow"></g>
          <circle class="ring-track" cx="160" cy="160" r="132" id="ringTrack"/>
          <circle class="ring-fill"  cx="160" cy="160" r="132" id="ringFill"/>
          <circle class="marker" cx="160" cy="160" r="0" id="marker"/>
        </svg>
        <div class="dial__core">
          <span class="state" id="state"><span class="state__dot"></span><span id="stateLabel">Active</span></span>
          <span class="since"><span class="since__v" id="sinceV">—</span><span class="since__u" id="sinceU"></span></span>
          <span class="since__lbl" id="sinceLbl">since last change</span>
          <span class="since__when" id="sinceWhen">—</span>
          <span class="demo" id="demo" hidden>illustrative data</span>
        </div>
      </div>

      <div class="ctx">
        <span class="ctx__pct" id="ctxPct">—<span>%</span></span>
        <span class="ctx__lbl">context window</span>
        <span class="ctx__note" id="ctxNote">—</span>
      </div>
    </section>

    <section class="panel rise" style="--d:.12s">
      <div class="read"><div class="read__k">Started</div><div class="read__v sm tnum" data-since id="vStarted">—</div></div>
      <div class="read"><div class="read__k">Last activity</div><div class="read__v sm tnum" data-since id="vActive">—</div></div>
      <div class="read"><div class="read__k">Messages</div><div class="read__v tnum" id="vMsgs">—</div></div>
      <div class="read"><div class="read__k">Model</div><div class="read__v sm" id="vModel">—</div></div>
      <div class="read" style="border-right:0"><div class="read__k">Session</div><div class="read__v sm" id="vId">—</div></div>
      <div class="read"><div class="read__k">Project</div><div class="read__v sm" id="vProj">—</div></div>
    </section>

    <section class="ledger rise" style="--d:.18s">
      <div class="ledger__h"><h2>Lifecycle</h2><span>re-inits &amp; compactions</span></div>
      <ol class="time" id="time"></ol>
    </section>

    <footer class="foot rise" style="--d:.24s">
      Reads <code>status.json</code> · a watcher keeps it live. Illustrative until then.
    </footer>
  </main>

  <script>
  /* ── data ──────────────────────────────────────────────────────────────── */
  const minsAgo=n=>new Date(Date.now()-n*60000).toISOString();
  function buildDemo(){
    return {updatedAt:new Date().toISOString(),isDemo:true,state:"active",
      lastEvent:{type:"compacted",at:minsAgo(37)},
      session:{shortId:"a7f3c9",model:"claude-opus-4-8",startedAt:minsAgo(214),
        lastActivityAt:minsAgo(0.4),messages:168,project:"TokenMerdiken"},
      context:{used:412000,limit:1000000,compactAt:800000},
      events:[{type:"compacted",at:minsAgo(37)},{type:"new_session",at:minsAgo(214)},
        {type:"compacted",at:minsAgo(286)},{type:"new_session",at:minsAgo(540)}]};
  }
  async function getStatus(){
    try{const r=await fetch("./status.json",{cache:"no-store"});
      if(r.ok){const d=await r.json();d.isDemo=false;return d;}}catch(_){}
    await new Promise(r=>setTimeout(r,180));return buildDemo();
  }

  /* ── helpers ───────────────────────────────────────────────────────────── */
  const $=(s)=>document.querySelector(s);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const STATE={active:{label:"Active",c:"var(--sage)"},compacted:{label:"Compacted",c:"var(--brass)"},new_session:{label:"Re-initialised",c:"var(--brass)"}};
  const ELABEL={compacted:"Context compacted",new_session:"Session re-initialised",active:"Active"};
  let latest=null;

  function rel(iso){const s=Math.max(0,(Date.now()-new Date(iso))/1000);
    if(s<45)return{v:Math.round(s),u:"sec"};const m=s/60;if(m<60)return{v:Math.round(m),u:"min"};
    const h=m/60;if(h<24)return{v:+h.toFixed(h<10?1:0),u:"hr"};return{v:+(h/24).toFixed(1),u:"days"};}
  const relText=iso=>{const{v,u}=rel(iso);return v+(u==="sec"?"s":u==="min"?"m":u==="hr"?"h":"d")+" ago";};
  const clock=iso=>new Date(iso).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});
  const fmtT=n=>n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+"K":""+Math.round(n);

  /* dial geometry: a 270° arc, gap at the bottom */
  const CX=160,CY=160,R=132,SPAN=270,START=135;          // degrees, clockwise from East
  const C=2*Math.PI*R, VIS=C*SPAN/360;
  const pt=(r,deg)=>{const a=deg*Math.PI/180;return[CX+r*Math.cos(a),CY+r*Math.sin(a)];};

  function buildTicks(){
    const g=$("#ticks");let s="";const N=46;
    for(let i=0;i<N;i++){const deg=START+(i/(N-1))*SPAN;const major=i%5===0;
      const[r1x,r1y]=pt(R-22,deg),[r2x,r2y]=pt(R-(major?11:15),deg);
      s+=`<line class="tick${major?' tick--major':''}" x1="${r1x.toFixed(1)}" y1="${r1y.toFixed(1)}" x2="${r2x.toFixed(1)}" y2="${r2y.toFixed(1)}"/>`;}
    g.innerHTML=s;
  }

  function render(d){
    latest=d;
    const st=STATE[d.state]||STATE.active;
    $("#state").style.setProperty("--state",st.c);
    $("#stateLabel").textContent=st.label;
    $("#demo").hidden=!d.isDemo;

    const ev=d.lastEvent||{type:d.state,at:d.session&&d.session.startedAt};
    const r=rel(ev.at);
    $("#sinceV").textContent=r.v;$("#sinceU").textContent=r.u==="sec"?"sec":r.u==="min"?"min":r.u==="hr"?"hr":"days";
    $("#sinceWhen").textContent=`${ELABEL[ev.type]||"Event"} · ${clock(ev.at)}`;

    const ctx=d.context||{used:0,limit:1,compactAt:1};
    const pct=Math.min(100,Math.round(ctx.used/ctx.limit*100));
    const toC=Math.max(0,ctx.compactAt-ctx.used);
    const frac=Math.min(1,ctx.used/ctx.compactAt);
    const col=frac<0.7?"var(--brass)":"var(--clay)";

    $("#ringTrack").setAttribute("stroke-dasharray",`${VIS} ${C}`);
    $("#ringTrack").setAttribute("transform",`rotate(${START} ${CX} ${CY})`);
    const fill=$("#ringFill");
    fill.setAttribute("stroke-dasharray",`${VIS} ${C}`);
    fill.setAttribute("transform",`rotate(${START} ${CX} ${CY})`);
    fill.style.stroke=col;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      fill.style.strokeDashoffset=reduce?VIS*(1-frac):VIS*(1-frac);
    }));
    if(reduce)fill.setAttribute("stroke-dashoffset",VIS*(1-frac));
    else fill.setAttribute("stroke-dashoffset",VIS); // start empty, animate via style

    // marker dot at the arc's end
    const[mx,my]=pt(R,START+frac*SPAN);
    const m=$("#marker");m.setAttribute("cx",mx.toFixed(1));m.setAttribute("cy",my.toFixed(1));
    m.setAttribute("r","4.5");m.style.fill=col;

    $("#ctxPct").innerHTML=`${pct}<span>%</span>`;
    $("#ctxNote").textContent=toC>0?`${fmtT(toC)} tokens before auto-compaction`:`compaction threshold reached`;

    const s=d.session||{};
    setSince($("#vStarted"),s.startedAt);
    setSince($("#vActive"),s.lastActivityAt);
    $("#vMsgs").textContent=s.messages!=null?s.messages:"—";
    $("#vModel").textContent=(s.model||"—").replace(/^claude-/,"");
    $("#vId").textContent=s.shortId||"—";
    $("#vProj").textContent=s.project||"—";

    const tl=$("#time"),evs=(d.events||[]).slice(0,6);
    tl.innerHTML=evs.length?evs.map(e=>{const c=(STATE[e.type]||STATE.active).c;
      return `<li style="--dotc:${c}"><span class="time__label">${ELABEL[e.type]||e.type}</span><span class="time__time" data-since data-at="${e.at}">${relText(e.at)} · ${clock(e.at)}</span></li>`;}).join("")
      :`<li class="time__empty">No lifecycle events recorded yet.</li>`;

    const dot=$("#syncDot");
    if(d.isDemo){dot.classList.remove("is-live");$("#syncText").textContent="illustrative";}
    else{const age=(Date.now()-new Date(d.updatedAt))/1000;
      if(age<90){dot.classList.add("is-live");$("#syncText").textContent="live "+clock(d.updatedAt);}
      else{dot.classList.remove("is-live");$("#syncText").textContent="synced "+relText(d.updatedAt);}}
  }
  function setSince(el,iso){if(!iso){el.textContent="—";return;}el.dataset.at=iso;el.textContent=relText(iso);}

  function tick(){
    if(!latest)return;
    const ev=latest.lastEvent||{at:latest.session&&latest.session.startedAt};
    if(ev&&ev.at){const r=rel(ev.at);$("#sinceV").textContent=r.v;
      $("#sinceU").textContent=r.u==="sec"?"sec":r.u==="min"?"min":r.u==="hr"?"hr":"days";}
    document.querySelectorAll("[data-since][data-at]").forEach(el=>{
      el.textContent=relText(el.dataset.at)+(el.classList.contains("time__time")?" · "+clock(el.dataset.at):"");});
  }

  async function refresh(){$("#syncDot").classList.remove("is-live");$("#syncText").textContent="syncing";render(await getStatus());}

  (function(){
    buildTicks();
    refresh().then(()=>$("#app").classList.add("is-ready"));
    $("#refresh").addEventListener("click",refresh);
    setInterval(refresh,10000);
    setInterval(tick,1000);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh();});
  })();
  </script>
</body>
</html>
