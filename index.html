<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Session Monitor · Claude Code</title>
  <meta name="description" content="Glance and see your Claude Code session state — re-inits, compaction, context fullness." />
  <meta name="theme-color" content="#0c1322" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="aura" aria-hidden="true"></div>

  <main class="wrap" id="app" data-loading>
    <!-- header -->
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.5 2.5M16.5 16.5L19 19M19 5l-2.5 2.5M7.5 16.5L5 19"/>
            <circle cx="12" cy="12" r="3.2"/>
          </svg>
        </span>
        <span class="brand__name">Session Monitor</span>
      </div>
      <div class="sync">
        <span class="sync__dot" id="syncDot"></span>
        <span id="syncText">syncing…</span>
        <button class="iconbtn" id="refresh" title="Sync now" aria-label="Sync now">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- HERO: the one glance -->
    <section class="hero" id="hero" data-state="active">
      <div class="hero__row">
        <span class="status-pill" id="statePill">
          <span class="status-pill__dot"></span>
          <span id="stateLabel">Active</span>
        </span>
        <span class="demo-pill" id="demoPill" hidden>demo</span>
      </div>

      <p class="hero__lead" id="heroLead">Last change</p>
      <h1 class="hero__big">
        <span id="sinceValue">—</span><span class="hero__unit" id="sinceUnit"></span>
      </h1>
      <p class="hero__sub" id="heroSub">—</p>
    </section>

    <!-- BENTO -->
    <section class="bento">
      <!-- context gauge -->
      <article class="tile tile--gauge">
        <div class="tile__head">
          <h2>Context window</h2>
          <span class="tile__hint" id="ctxHint">to compaction</span>
        </div>
        <div class="gauge">
          <svg viewBox="0 0 120 120" class="gauge__svg" id="gaugeSvg" aria-hidden="true">
            <circle class="gauge__track" cx="60" cy="60" r="52"/>
            <circle class="gauge__fill"  cx="60" cy="60" r="52" id="gaugeFill"/>
          </svg>
          <div class="gauge__center">
            <span class="gauge__pct" id="ctxPct">0<span>%</span></span>
            <span class="gauge__cap" id="ctxCap">full</span>
          </div>
        </div>
        <p class="gauge__note" id="ctxNote">—</p>
      </article>

      <!-- vitals -->
      <article class="tile tile--vitals">
        <div class="tile__head"><h2>Session</h2></div>
        <ul class="vitals">
          <li>
            <span class="vitals__ic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            </span>
            <span class="vitals__k">Started</span>
            <span class="vitals__v" data-since id="vStarted">—</span>
          </li>
          <li>
            <span class="vitals__ic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
            </span>
            <span class="vitals__k">Last activity</span>
            <span class="vitals__v" data-since id="vActive">—</span>
          </li>
          <li>
            <span class="vitals__ic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </span>
            <span class="vitals__k">Messages</span>
            <span class="vitals__v" id="vMsgs">—</span>
          </li>
          <li>
            <span class="vitals__ic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6v6H9z"/></svg>
            </span>
            <span class="vitals__k">Model</span>
            <span class="vitals__v mono" id="vModel">—</span>
          </li>
          <li>
            <span class="vitals__ic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M7 9l5 5 5-5"/><path d="M12 14V3"/></svg>
            </span>
            <span class="vitals__k">Session id</span>
            <span class="vitals__v mono" id="vId">—</span>
          </li>
        </ul>
      </article>

      <!-- lifecycle log -->
      <article class="tile tile--log">
        <div class="tile__head">
          <h2>Lifecycle</h2>
          <span class="tile__hint">re-inits &amp; compactions</span>
        </div>
        <ol class="log" id="log"></ol>
      </article>
    </section>

    <footer class="foot">
      <span id="footText">Reads <code>status.json</code> · falls back to demo data.</span>
    </footer>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
